# The three templates `docs/09` §Post-release asks for, and nothing else: an issue that arrives with the four
# facts below in it is an issue someone can act on. Security reports are routed out of the tracker on purpose —
# a public issue is the wrong place for a token or a vault path.
blank_issues_enabled: false
contact_links:
    - name: Security report
      url: https://github.com/258044aamm-Dev/Tablify/security/advisories/new
      about: Report a vulnerability privately, never in a public issue.
    - name: Obsidian's own bug reports
      url: https://forum.obsidian.md/c/bug-reports/7
      about: If the problem happens with Tablify disabled, it belongs to Obsidian, not to this plugin.
