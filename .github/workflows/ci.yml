name: CI

on:
    # `main` only, plus PRs and a manual dispatch. A tag used to run this job *and* the Release workflow, which
    # runs the same gate a second time before it publishes — `release.yml` is the tag's verification, so the
    # duplicate is not defence in depth, it is the same check twice. (Found by pushing the `0.1.0` pre-release
    # and watching two runs start; the tag's own run is what the release was cut from.)
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

concurrency:
    # One run per ref: a new push cancels the run it supersedes, so the queue never grows stale.
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    gate:
        name: gate
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            # Keyed on bun.lock, so a dependency change invalidates it and nothing else does.
            - name: Cache bun's install cache
              uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
                  restore-keys: |
                      bun-${{ runner.os }}-

            # --frozen-lockfile: CI must fail if the lockfile would change, never silently resolve new versions.
            - run: bun install --frozen-lockfile

            - run: bun run typecheck
            - run: bun run lint
            - run: bun run format:check
            - run: bun run test
            - run: bun run build
            - run: bun run contrast
            - run: bun run css:gate
            - run: bun run size

            # The layout gate: a browser, the real components, and thirteen assertions per viewport
            # (`docs/07` §Tier 4). `bun run test:layout` builds the plugin *and* the harness bundle first, so the
            # page always renders the current `styles.css`.
            #
            # Step 21 removed the temporary "does the harness exist yet?" guard that stood here: the files exist,
            # so the suite runs unconditionally, and a failing assertion fails the build.
            - name: Cache Playwright's browsers
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  # Keyed on bun.lock, so a dependency change invalidates it and nothing else does.
                  key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
                  restore-keys: |
                      playwright-${{ runner.os }}-

            - name: Install Chromium for the layout harness
              run: bunx playwright install --with-deps chromium

            # Twenty-three assertions × five viewports, one worker. Measured both sides: "115 passed (3.7m)" on
            # the release tree, and **2m20s for this step** on the runner (job 3m44s) in run 37459798546 — the
            # first run of this workflow to reach a conclusion, because every earlier one was cancelled by the
            # next push while this step was still going (`cancel-in-progress` above, which cancels rather than
            # queues). A duration problem it never was; the timeout below is the one thing that run still left
            # owed. See `PROGRESS.md` §step 27, finding 5.
            - name: Layout suite (twenty-three assertions × five viewports)
              run: bun run test:layout
              # Twenty minutes is a hang detector, not a budget — five times the slowest measured run of this
              # step. The failure it exists to catch is a step that never finishes, which is the shape the
              # cancelled runs of steps 27–28 *looked* like before the queue artefact was found.
              timeout-minutes: 20

            - name: Upload the Playwright report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report
                  if-no-files-found: ignore
