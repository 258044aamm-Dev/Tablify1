name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

concurrency:
    # One run per ref: a new push cancels the run it supersedes, so the queue never grows stale.
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    gate:
        name: gate
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            # Keyed on bun.lock, so a dependency change invalidates it and nothing else does.
            - name: Cache bun's install cache
              uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
                  restore-keys: |
                      bun-${{ runner.os }}-

            # --frozen-lockfile: CI must fail if the lockfile would change, never silently resolve new versions.
            - run: bun install --frozen-lockfile

            - run: bun run typecheck
            - run: bun run lint
            - run: bun run format:check
            - run: bun run test
            - run: bun run build
            - run: bun run contrast
            - run: bun run css:gate
            - run: bun run size

            # The layout gate: a browser, the real components, and thirteen assertions per viewport
            # (`docs/07` §Tier 4). `bun run test:layout` builds the plugin *and* the harness bundle first, so the
            # page always renders the current `styles.css`.
            #
            # Step 21 removed the temporary "does the harness exist yet?" guard that stood here: the files exist,
            # so the suite runs unconditionally, and a failing assertion fails the build.
            - name: Cache Playwright's browsers
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  # Keyed on bun.lock, so a dependency change invalidates it and nothing else does.
                  key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
                  restore-keys: |
                      playwright-${{ runner.os }}-

            - name: Install Chromium for the layout harness
              run: bunx playwright install --with-deps chromium

            # Twenty-three assertions × five viewports, one worker: "115 passed (4.0m)" on the workstation that
            # built step 27. It is nevertheless the one stage of this workflow that has never reached a
            # conclusion — every earlier run was cancelled by the next push (`cancel-in-progress` above) while
            # this step was still running. Four minutes locally against a hundred on a runner is not a budget
            # problem, so the release step owes this job an explicit `timeout-minutes`: a stage that cannot
            # finish should fail loudly instead of holding the workflow open. Recorded in `PROGRESS.md` §step 27.
            - name: Layout suite (twenty-three assertions × five viewports)
              run: bun run test:layout

            - name: Upload the Playwright report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report
                  if-no-files-found: ignore
